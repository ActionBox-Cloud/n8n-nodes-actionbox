name: Publish to npm
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ActionBox-Cloud/n8n-nodes-actionbox' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require the version tag and successful public CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-publish.cjs
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion \
            | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:runtime
      - run: npm pack --dry-run
      - name: Publish with provenance
        run: npm publish --provenance --access public
