services:
  n8n:
    build: .
    image: actionbox-n8n-pilot:0.1.0
    ports:
      - '127.0.0.1:5688:5678'
    environment:
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_SECURE_COOKIE: 'false'
      N8N_WEBHOOK_URL: '${ACTIONBOX_N8N_WEBHOOK_URL:-http://localhost:5688/}'
    volumes:
      - n8n-data:/home/node/.n8n
volumes:
  n8n-data:
